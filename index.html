    <!-- إزالة شاشة "TAP TO START": تُخفى ويُضغط زرها تلقائياً لبدء اللعبة مباشرة -->
    <script type="text/javascript">
        (function () {
            var done = false;
            function autoStart() {
                if (done) return;
                var el = document.getElementById('play-desktop');
                if (!el) return;
                done = true;
                try {
                    el.click();
                } catch (e) {}
            }
            if (window.MutationObserver && document.documentElement) {
                new MutationObserver(function () { autoStart(); })
                    .observe(document.documentElement, { childList: true, subtree: true });
            }
            setInterval(autoStart, 300);
        })();
    </script>
